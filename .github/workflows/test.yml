name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: the suite runs on the Node standard library alone, so there is no
      # lockfile to keep current and nothing third-party in the path of a package that handles
      # OAuth refresh tokens.
      - run: npm test
